<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentinelScan Audit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f0f2f5; color: #1a1f36; font-family: 'Segoe UI', system-ui, sans-serif; }
        .audit-card {
            background: white; border: none; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); margin-top: 50px; overflow: hidden;
        }
        .audit-header { background: #1a1f36; color: white; padding: 30px; }
        .url-box { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; padding: 15px; font-family: monospace; }
        
        /* Analysis Section Styling */
        .report-content { padding: 40px; }
        .section-title { 
            font-weight: 700; color: #4a5568; text-transform: uppercase; 
            letter-spacing: 0.5px; font-size: 0.9rem; margin-bottom: 15px;
            display: flex; align-items: center;
        }
        .section-title i { margin-right: 10px; color: #0d6efd; }

        .report-text {
            white-space: pre-wrap; line-height: 1.8; color: #2d3748;
            background: #fff; padding: 10px 0; font-size: 1.05rem;
        }
        
        .footer-brand { border-top: 1px solid #edf2f7; padding: 20px; text-align: center; background: #f8fafc; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="audit-card">
                    
                    <!-- Header -->
                    <div class="audit-header d-flex justify-content-between align-items-center">
                        <div>
                            <h4 class="mb-1"><i class="bi bi-shield-lock-fill me-2"></i>SentinelScan Security Audit</h4>
                            <p class="mb-0 opacity-75 small">Engine: {{ result.risk_score }}</p>
                        </div>
                        <span class="badge bg-info text-dark fw-bold">LIVE REPORT</span>
                    </div>

                    <div class="report-content">
                        <!-- Analysis Target -->
                        <div class="mb-5">
                            <div class="section-title"><i class="bi bi-geo-alt"></i>Analysis Target</div>
                            <div class="url-box text-primary h5 mb-0">{{ result.url }}</div>
                        </div>

                        <!-- Technical Details -->
                        <div class="mb-4">
                            <div class="section-title"><i class="bi bi-activity"></i>Technical Assessment & Findings</div>
                            <div class="report-text">{{ result.details }}</div>
                        </div>

                        <!-- Action Button -->
                        <div class="text-center mt-5">
                            <a href="/" class="btn btn-dark btn-lg px-5 rounded-pill shadow">
                                <i class="bi bi-arrow-repeat me-2"></i>New Security Scan
                            </a>
                        </div>
                    </div>

                    <!-- Copyright info -->
<div class="footer-brand">
                        <small class="text-muted">© 2026 SentinelScan AI | Shivam Ugale</small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
